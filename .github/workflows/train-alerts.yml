name: Train alerts

# One run checks the lines every minute for about 5.5 hours, then starts the
# next run itself, so checking never stops. The schedule below is only a
# backup that restarts the chain if a run ever fails.
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

concurrency:
  group: train-alerts
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests

      # Restores the statuses saved by the last run so you are not texted twice about the same problem.
      - name: Restore last known status
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: train-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: train-state-

      - name: Check lines every minute and send SMS
        env:
          PURESMS_API_KEY: ${{ secrets.PURESMS_API_KEY }}
          PURESMS_SENDER: ${{ secrets.PURESMS_SENDER }}
          ALERT_TO_NUMBER: ${{ secrets.ALERT_TO_NUMBER }}
          TFL_APP_KEY: ${{ secrets.TFL_APP_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NR_INCIDENTS_KEY: ${{ secrets.NR_INCIDENTS_KEY }}
          RUN_MINUTES: "330"
          CHECK_SECONDS: "60"
          QUIET_HOURS: "00:00-05:00"
        run: python train_alerts.py

      - name: Save status
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: train-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Start the next run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run train-alerts.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
