name: Probe National Rail boards

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/probe_ldb.py
        env:
          NR_LDB_KEY: ${{ secrets.NR_LDB_KEY }}
